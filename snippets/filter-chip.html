<!-- 未選択（aria-pressed="false"）: チェックは CSS で非表示になる -->
<button type="button" class="filter-chip" aria-pressed="false">
  <span class="filter-chip-main">
    <span class="filter-chip-label">自治体連携</span>
  </span>
  <span class="filter-chip-count">124件</span>
  <span class="filter-chip-check">
    <span class="filter-chip-check-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
    </span>
  </span>
</button>

<!-- 選択中（aria-pressed="true"）: 右端に塗りまる + 白チェックが出る -->
<button type="button" class="filter-chip" aria-pressed="true">
  <span class="filter-chip-main">
    <span class="filter-chip-label">自治体連携</span>
  </span>
  <span class="filter-chip-count">124件</span>
  <span class="filter-chip-check">
    <span class="filter-chip-check-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
    </span>
  </span>
</button>

<!-- 左アイコン付き（filter-chip-icon は任意）。Lucide sprite の <use> でも可 -->
<button type="button" class="filter-chip" aria-pressed="false">
  <span class="filter-chip-main">
    <span class="filter-chip-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></svg>
    </span>
    <span class="filter-chip-label">自治体連携</span>
  </span>
  <span class="filter-chip-count">124件</span>
  <span class="filter-chip-check">
    <span class="filter-chip-check-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
    </span>
  </span>
</button>
