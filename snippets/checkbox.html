<!-- Single -->
<label class="checkbox-label">
  <input type="checkbox" class="checkbox" />
  利用規約に同意する
</label>

<!-- Checked -->
<label class="checkbox-label">
  <input type="checkbox" class="checkbox" checked />
  通知を受け取る
</label>

<!-- Disabled -->
<label class="checkbox-label">
  <input type="checkbox" class="checkbox" disabled />
  選択できません
</label>

<!-- Group — label-control をグループの上に置く -->
<div>
  <div class="label-control mb-2">
    <div class="label-control-row">
      <span class="label-control-text">通知設定</span>
    </div>
  </div>
  <fieldset class="flex flex-col gap-2">
    <label class="checkbox-label"><input type="checkbox" class="checkbox" checked /> メール</label>
    <label class="checkbox-label"><input type="checkbox" class="checkbox" /> SMS</label>
    <label class="checkbox-label"><input type="checkbox" class="checkbox" /> プッシュ通知</label>
  </fieldset>
</div>
