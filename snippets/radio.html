<!-- Vertical group -->
<fieldset class="radio-group">
  <legend class="field-label mb-2">プラン</legend>
  <label class="radio-label"><input type="radio" name="plan" class="radio" checked /> Free</label>
  <label class="radio-label"><input type="radio" name="plan" class="radio" /> Pro</label>
  <label class="radio-label"><input type="radio" name="plan" class="radio" /> Enterprise</label>
</fieldset>

<!-- Horizontal group -->
<fieldset class="radio-group-horizontal">
  <legend class="field-label mb-2">サイズ</legend>
  <label class="radio-label"><input type="radio" name="size" class="radio" /> S</label>
  <label class="radio-label"><input type="radio" name="size" class="radio" checked /> M</label>
  <label class="radio-label"><input type="radio" name="size" class="radio" /> L</label>
  <label class="radio-label"><input type="radio" name="size" class="radio" disabled /> XL</label>
</fieldset>
