<!-- Basic with label -->
<div class="field">
  <label class="field-label" for="email">メールアドレス</label>
  <input id="email" type="email" class="input" placeholder="you@example.com" />
  <span class="field-hint">ログインに使用します</span>
</div>

<!-- Error state -->
<div class="field">
  <label class="field-label" for="pw">パスワード</label>
  <input id="pw" type="password" class="input input-error" />
  <span class="field-error">8文字以上で入力してください</span>
</div>

<!-- Disabled -->
<div class="field">
  <label class="field-label" for="name">氏名</label>
  <input id="name" type="text" class="input" value="山田 太郎" disabled />
</div>
