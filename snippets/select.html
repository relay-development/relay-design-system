<!-- Basic -->
<div class="space-y-2">
  <div class="label-control">
    <div class="label-control-row">
      <label class="label-control-text" for="country">国</label>
    </div>
  </div>
  <select id="country" class="select">
    <option value="">選択してください</option>
    <option value="jp">日本</option>
    <option value="us">アメリカ</option>
    <option value="uk">イギリス</option>
  </select>
</div>

<!-- Error — エラーメッセージは選択欄の「真下」に置き、aria で関連付ける -->
<div class="space-y-2">
  <div class="label-control">
    <div class="label-control-row">
      <label class="label-control-text" for="plan">プラン</label>
      <span class="label-badge label-badge-required">必須</span>
    </div>
  </div>
  <div>
    <select id="plan" class="select select-error" aria-invalid="true" aria-describedby="plan-err">
      <option value="">未選択</option>
      <option value="free">Free</option>
      <option value="pro">Pro</option>
    </select>
    <p id="plan-err" class="field-error-text">＊プランを選択してください</p>
  </div>
</div>

<!-- Disabled -->
<select class="select" disabled>
  <option>編集できません</option>
</select>

<!-- アイコン枠・サイズ・エラー枠が要るときは selector で包む（中の select は同じ .select） -->
<div class="selector selector-md">
  <span class="selector-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect x="2" y="6" width="20" height="14" rx="2"/></svg>
  </span>
  <select class="select" aria-label="業種">
    <option value="">業種を選択</option>
    <option value="a">業種A</option>
    <option value="b">業種B</option>
  </select>
</div>
