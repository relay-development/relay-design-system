<!-- Basic -->
<div class="field">
  <label class="field-label" for="country">国</label>
  <select id="country" class="select">
    <option value="">選択してください</option>
    <option value="jp">日本</option>
    <option value="us">アメリカ</option>
    <option value="uk">イギリス</option>
  </select>
</div>

<!-- Error -->
<div class="field">
  <label class="field-label" for="plan">プラン</label>
  <select id="plan" class="select select-error">
    <option value="">未選択</option>
    <option value="free">Free</option>
    <option value="pro">Pro</option>
  </select>
  <span class="field-error">プランを選択してください</span>
</div>

<!-- Disabled -->
<select class="select" disabled>
  <option>編集できません</option>
</select>
