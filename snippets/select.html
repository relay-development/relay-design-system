<!-- Basic -->
<div class="space-y-2">
  <div class="label-control">
    <div class="label-control-row">
      <label class="label-control-text" for="country">国</label>
    </div>
  </div>
  <select id="country" class="select">
    <option value="">選択してください</option>
    <option value="jp">日本</option>
    <option value="us">アメリカ</option>
    <option value="uk">イギリス</option>
  </select>
</div>

<!-- Error — エラーメッセージは選択欄の「真下」に置き、aria で関連付ける -->
<div class="space-y-2">
  <div class="label-control">
    <div class="label-control-row">
      <label class="label-control-text" for="plan">プラン</label>
      <span class="label-badge label-badge-required">必須</span>
    </div>
  </div>
  <div>
    <select id="plan" class="select select-error" aria-invalid="true" aria-describedby="plan-err">
      <option value="">未選択</option>
      <option value="free">Free</option>
      <option value="pro">Pro</option>
    </select>
    <p id="plan-err" class="field-error-text">＊プランを選択してください</p>
  </div>
</div>

<!-- Disabled -->
<select class="select" disabled>
  <option>編集できません</option>
</select>
