  <main class="max-w-5xl mx-auto px-6 py-10 space-y-16">
    <section id="assets">
      <div class="flex items-baseline justify-between mb-8">
        <h2 class="typo-2xlarge">アセット</h2>
        <span class="badge badge-soft-neutral">foundation</span>
      </div>
      <p class="typo-article text-fg-high mb-6">ロゴやイラストの画像素材をダウンロードできます。各カードの「ダウンロード」からファイルを保存してください。</p>

      <!-- ===== ロゴ ===== -->
      <div class="card mb-6">
        <div class="card-header">
          <h3 class="card-title">ロゴ</h3>
          <p class="card-subtitle">SVG（拡大しても劣化しません）</p>
        </div>
        <div class="card-body">
          <div class="grid sm:grid-cols-2 gap-4">
            <div class="border border-stroke-low rounded-md overflow-hidden">
              <div class="flex items-center justify-center p-6 bg-neutral-50" style="min-height: calc(var(--spacing) * 28);">
                <img src="./assets/relay_logo.svg" alt="relay サービスロゴ" class="max-w-full max-h-16" />
              </div>
              <div class="flex items-center justify-between gap-3 px-4 py-3 border-t border-stroke-low">
                <div>
                  <p class="typo-small font-semibold text-fg-high">サービスロゴ</p>
                  <p class="typo-xsmall text-fg-low font-mono">relay_logo.svg · SVG</p>
                </div>
                <a class="btn btn-md btn-neutral btn-outline shrink-0" href="./assets/relay_logo.svg" download>
                  <svg class="icon icon-sm" aria-hidden="true"><use href="./icons.svg#lucide-download"></use></svg>
                  ダウンロード
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ===== イラスト ===== -->
      <div class="card mb-6">
        <div class="card-header">
          <h3 class="card-title">イラスト</h3>
          <p class="card-subtitle">PNG（背景透過）</p>
        </div>
        <div class="card-body">
          <div class="grid sm:grid-cols-3 gap-4">
            <div class="border border-stroke-low rounded-md overflow-hidden">
              <div class="flex items-center justify-center p-4 bg-neutral-50" style="min-height: calc(var(--spacing) * 32);">
                <img src="./assets/relay_main.png" alt="relay メインイラスト" class="max-w-full max-h-36" />
              </div>
              <div class="flex items-center justify-between gap-2 px-4 py-3 border-t border-stroke-low">
                <div class="min-w-0">
                  <p class="typo-small font-semibold text-fg-high">メイン</p>
                  <p class="typo-xsmall text-fg-low font-mono truncate">relay_main.png</p>
                </div>
                <a class="icon-btn icon-btn-md icon-btn-neutral icon-btn-outline shrink-0" href="./assets/relay_main.png" download aria-label="メインをダウンロード">
                  <svg class="icon" aria-hidden="true"><use href="./icons.svg#lucide-download"></use></svg>
                </a>
              </div>
            </div>
            <div class="border border-stroke-low rounded-md overflow-hidden">
              <div class="flex items-center justify-center p-4 bg-neutral-50" style="min-height: calc(var(--spacing) * 32);">
                <img src="./assets/Transferor.png" alt="譲り手のイラスト" class="max-w-full max-h-36" />
              </div>
              <div class="flex items-center justify-between gap-2 px-4 py-3 border-t border-stroke-low">
                <div class="min-w-0">
                  <p class="typo-small font-semibold text-fg-high">譲り手</p>
                  <p class="typo-xsmall text-fg-low font-mono truncate">Transferor.png</p>
                </div>
                <a class="icon-btn icon-btn-md icon-btn-neutral icon-btn-outline shrink-0" href="./assets/Transferor.png" download aria-label="譲り手をダウンロード">
                  <svg class="icon" aria-hidden="true"><use href="./icons.svg#lucide-download"></use></svg>
                </a>
              </div>
            </div>
            <div class="border border-stroke-low rounded-md overflow-hidden">
              <div class="flex items-center justify-center p-4 bg-neutral-50" style="min-height: calc(var(--spacing) * 32);">
                <img src="./assets/Transferee.png" alt="継ぎ手のイラスト" class="max-w-full max-h-36" />
              </div>
              <div class="flex items-center justify-between gap-2 px-4 py-3 border-t border-stroke-low">
                <div class="min-w-0">
                  <p class="typo-small font-semibold text-fg-high">継ぎ手</p>
                  <p class="typo-xsmall text-fg-low font-mono truncate">Transferee.png</p>
                </div>
                <a class="icon-btn icon-btn-md icon-btn-neutral icon-btn-outline shrink-0" href="./assets/Transferee.png" download aria-label="継ぎ手をダウンロード">
                  <svg class="icon" aria-hidden="true"><use href="./icons.svg#lucide-download"></use></svg>
                </a>
              </div>
            </div>
            <div class="border border-stroke-low rounded-md overflow-hidden">
              <div class="flex items-center justify-center p-4 bg-neutral-50" style="min-height: calc(var(--spacing) * 32);">
                <img src="./assets/hero-left.png" alt="継ぎ手の皆さんのイラスト" class="max-w-full max-h-36" />
              </div>
              <div class="flex items-center justify-between gap-2 px-4 py-3 border-t border-stroke-low">
                <div class="min-w-0">
                  <p class="typo-small font-semibold text-fg-high">継ぎ手の皆さん</p>
                  <p class="typo-xsmall text-fg-low font-mono truncate">hero-left.png</p>
                </div>
                <a class="icon-btn icon-btn-md icon-btn-neutral icon-btn-outline shrink-0" href="./assets/hero-left.png" download aria-label="継ぎ手の皆さんをダウンロード">
                  <svg class="icon" aria-hidden="true"><use href="./icons.svg#lucide-download"></use></svg>
                </a>
              </div>
            </div>
            <div class="border border-stroke-low rounded-md overflow-hidden">
              <div class="flex items-center justify-center p-4 bg-neutral-50" style="min-height: calc(var(--spacing) * 32);">
                <img src="./assets/hero-right.png" alt="譲り手の皆さんのイラスト" class="max-w-full max-h-36" />
              </div>
              <div class="flex items-center justify-between gap-2 px-4 py-3 border-t border-stroke-low">
                <div class="min-w-0">
                  <p class="typo-small font-semibold text-fg-high">譲り手の皆さん</p>
                  <p class="typo-xsmall text-fg-low font-mono truncate">hero-right.png</p>
                </div>
                <a class="icon-btn icon-btn-md icon-btn-neutral icon-btn-outline shrink-0" href="./assets/hero-right.png" download aria-label="譲り手の皆さんをダウンロード">
                  <svg class="icon" aria-hidden="true"><use href="./icons.svg#lucide-download"></use></svg>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
