<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>契約一覧</title>
  <link rel="stylesheet" href="./relay.css">
</head>
<body class="bg-page">
  <main class="mx-auto max-w-5xl px-6 py-12">
    <header class="mb-8">
      <h1 class="typo-2xlarge text-fg-high mb-2">契約一覧</h1>
      <p class="typo-medium text-fg-middle">締結済みの契約の取引先・金額と、現在の状態を確認できます。</p>
    </header>

    <table class="data-table">
      <thead>
        <tr>
          <th>契約名</th>
          <th>取引先</th>
          <th class="text-right">金額（税込）</th>
          <th>状態</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>業務委託基本契約</td>
          <td>株式会社グリーンフィールド</td>
          <td class="text-right">1,320,000 円</td>
          <td><span class="badge badge-soft-success">有効</span></td>
        </tr>
        <tr>
          <td>クラウドサービス利用契約</td>
          <td>ライトワークス株式会社</td>
          <td class="text-right">396,000 円</td>
          <td><span class="badge badge-soft-success">有効</span></td>
        </tr>
        <tr>
          <td>保守運用契約</td>
          <td>株式会社エヌ・ティー・システムズ</td>
          <td class="text-right">2,640,000 円</td>
          <td><span class="badge badge-soft-info">審査中</span></td>
        </tr>
        <tr>
          <td>販売代理店契約</td>
          <td>サンライズ商事株式会社</td>
          <td class="text-right">5,500,000 円</td>
          <td><span class="badge badge-soft-danger">期限切れ</span></td>
        </tr>
        <tr>
          <td>秘密保持契約</td>
          <td>株式会社みらいデザイン</td>
          <td class="text-right">—</td>
          <td><span class="badge badge-soft-success">有効</span></td>
        </tr>
        <tr>
          <td>ソフトウェアライセンス契約</td>
          <td>株式会社テックブリッジ</td>
          <td class="text-right">880,000 円</td>
          <td><span class="badge badge-soft-danger">期限切れ</span></td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
