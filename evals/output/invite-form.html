<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>メンバー招待</title>
  <link rel="stylesheet" href="./relay.css" />
</head>
<body class="bg-page">
  <main class="max-w-xl mx-auto py-12 px-6">
    <form id="invite-form" class="card" novalidate>
      <div class="card-header">
        <h1 class="card-title">メンバーを招待</h1>
        <p class="card-subtitle">招待メールが相手に届き、承認するとメンバーに追加されます</p>
      </div>

      <div class="card-body space-y-6">
        <!-- メールアドレス（必須） -->
        <div class="space-y-2">
          <div class="label-control">
            <div class="label-control-row">
              <label class="label-control-text" for="invite-email">メールアドレス</label>
              <span class="label-badge label-badge-required">必須</span>
            </div>
            <p class="label-control-support">招待メールの送り先になります</p>
          </div>
          <input id="invite-email" name="email" type="email" class="input input-md" placeholder="you@example.com" required autocomplete="email" />
          <p id="invite-email-error" class="typo-medium text-negative-600" hidden>メールアドレスを入力してください</p>
        </div>

        <!-- 役割（必須・単一選択） -->
        <div>
          <div class="label-control mb-2">
            <div class="label-control-row">
              <span class="label-control-text" id="invite-role-label">役割</span>
              <span class="label-badge label-badge-required">必須</span>
            </div>
            <p class="label-control-support">招待した後からでも変更できます</p>
          </div>
          <fieldset class="radio-group" aria-labelledby="invite-role-label">
            <label class="radio-label">
              <input type="radio" name="role" value="admin" class="radio" />
              管理者 — メンバーの追加・削除やすべての設定ができます
            </label>
            <label class="radio-label">
              <input type="radio" name="role" value="editor" class="radio" />
              編集者 — コンテンツの作成と編集ができます
            </label>
            <label class="radio-label">
              <input type="radio" name="role" value="viewer" class="radio" checked />
              閲覧者 — コンテンツを見ることだけができます
            </label>
          </fieldset>
        </div>

        <!-- 補足メモ（任意） -->
        <div class="space-y-2">
          <div class="label-control">
            <div class="label-control-row">
              <label class="label-control-text" for="invite-note">補足メモ</label>
              <span class="label-badge label-badge-optional">任意</span>
            </div>
            <p class="label-control-support">招待メールに添えるメッセージがあれば入力してください</p>
          </div>
          <div class="textarea-control">
            <textarea id="invite-note" name="note" class="textarea textarea-md" placeholder="例）来月のプロジェクトからご一緒します。よろしくお願いします。" maxlength="200" rows="4"></textarea>
            <div class="textarea-footer">
              <span class="textarea-counter" id="invite-note-counter">0/200</span>
            </div>
          </div>
        </div>
      </div>

      <div class="card-footer">
        <button type="button" class="btn btn-md btn-neutral btn-outline">キャンセル</button>
        <button type="submit" class="btn btn-md btn-primary btn-solid">招待を送信</button>
      </div>
    </form>
  </main>

  <script>
    const form = document.getElementById("invite-form");
    const email = document.getElementById("invite-email");
    const emailError = document.getElementById("invite-email-error");
    const note = document.getElementById("invite-note");
    const counter = document.getElementById("invite-note-counter");

    note.addEventListener("input", () => {
      counter.textContent = `${note.value.length}/${note.maxLength}`;
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const valid = email.checkValidity();
      email.classList.toggle("input-error", !valid);
      emailError.hidden = valid;
      email.setAttribute("aria-invalid", String(!valid));
      if (!valid) {
        email.focus();
        return;
      }
      // 送信処理はダミー（デモページのため）
      form.querySelector('button[type="submit"]').setAttribute("data-loading", "");
    });

    email.addEventListener("input", () => {
      if (email.checkValidity()) {
        email.classList.remove("input-error");
        emailError.hidden = true;
        email.setAttribute("aria-invalid", "false");
      }
    });
  </script>
</body>
</html>
