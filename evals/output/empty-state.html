<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>プロジェクト一覧</title>
  <link rel="stylesheet" href="./relay.css" />
</head>
<body class="bg-page text-fg-high">

  <!-- インライン SVG スプライト（Lucide 相当。外部 .svg 参照はしない） -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display: none;" aria-hidden="true">
    <symbol id="lucide-folder-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 10v6" />
      <path d="M9 13h6" />
      <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" />
    </symbol>
    <symbol id="lucide-external-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 3h6v6" />
      <path d="M10 14 21 3" />
      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
    </symbol>
  </svg>

  <!-- ページヘッダー -->
  <header class="border-b border-stroke-middle">
    <div class="max-w-5xl mx-auto px-6 py-4">
      <h1 class="typo-2xlarge">プロジェクト一覧</h1>
    </div>
  </header>

  <!-- 空状態 -->
  <main class="max-w-5xl mx-auto px-6 py-16">
    <section class="max-w-md mx-auto flex flex-col items-center gap-8 text-center" aria-labelledby="empty-state-title">

      <div class="w-16 h-16 rounded-full bg-primary-50 flex items-center justify-center">
        <svg class="icon icon-xl text-primary-700" aria-hidden="true">
          <use href="#lucide-folder-plus"></use>
        </svg>
      </div>

      <div class="flex flex-col gap-2">
        <h2 id="empty-state-title" class="typo-large">まだプロジェクトがありません</h2>
        <p class="typo-medium text-fg-middle">
          最初のプロジェクトを作成すると、この画面に一覧として表示されます。
          作成はいつでもやり直せるので、まずは気軽に始めてみましょう。
        </p>
      </div>

      <div class="flex flex-col items-center gap-4">
        <button type="button" class="btn btn-md btn-primary btn-solid">最初のプロジェクトを作成する</button>
        <p class="typo-medium text-fg-middle">
          進め方に迷ったら
          <a class="link" href="/help/projects/getting-started" target="_blank" rel="noopener noreferrer">
            <span class="link-label">プロジェクトの始め方ガイド</span>
            <svg class="icon" aria-hidden="true"><use href="#lucide-external-link"></use></svg>
          </a>
          をご覧ください。
        </p>
      </div>

    </section>
  </main>

</body>
</html>
