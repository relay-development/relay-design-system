# Cloudflare Workers config for the relay Design System remote MCP server.
#   entry: src/mcp/worker.mjs  (Streamable HTTP MCP at POST /mcp, authless, stateless)
#   data:  dist/mcp-index.json — generated by the [build] hook below, then inlined
#          into the bundle by wrangler/esbuild (no KV / Durable Objects needed).
#
# Deploy:  npm run deploy:mcp   (or: wrangler deploy)
# Local:   npm run dev:mcp-remote  (wrangler dev → http://localhost:8787/mcp)
name = "relay-design-system-mcp"
main = "src/mcp/worker.mjs"
compatibility_date = "2025-01-01"
workers_dev = true

# Regenerate the data index before bundling (dist/ is gitignored).
[build]
command = "node scripts/build-mcp.mjs"
